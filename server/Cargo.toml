[package]
name = "mptube-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mptube-server"
path = "src/main.rs"

[dependencies]
mptube-core = { path = "../crates/mptube-core" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace"] }
tower_governor = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
fs2 = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
