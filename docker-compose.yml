services:
  mptube-server:
    # A imagem é publicada pelo CI (.github/workflows/web.yml) em push na main.
    # Na VPS: `docker compose pull && docker compose up -d` (sem compilar
    # nada localmente). Pra build local (dev), use `docker compose build`.
    image: ghcr.io/sandrocarvalho10/mptube-server:latest
    build: .
    restart: unless-stopped
    # Só escuta em localhost — o nginx do host é quem expõe pra internet (ver deploy/nginx.mptube.conf.example).
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/data
    # VPS de 1GB: limita o container pra um pico de ffmpeg/yt-dlp não derrubar
    # sshd/nginx do host (o OOM killer mata só o container, que reinicia).
    mem_limit: 700m
    memswap_limit: 1500m
    # Sem isso o log do Docker cresce sem limite e enche os 10GB de disco.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
