name: Build web (Docker)

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "server/**"
      - "crates/**"
      - "src/**"
      - "src-tauri/Cargo.toml"
      - "src-tauri/src/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "server/**"
      - "crates/**"
      - "src/**"
      - "src-tauri/Cargo.toml"
      - "src-tauri/src/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/web.yml"
  workflow_dispatch:
  # Toda segunda 06:00 UTC: rebuilda com o yt-dlp mais recente (o YouTube quebra
  # versões antigas com frequência).
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/sandrocarvalho10/mptube-server

jobs:
  build:
    runs-on: ubuntu-22.04
    name: Build mptube-server image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve latest yt-dlp version
        id: ytdlp
        run: |
          v=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest | jq -r .tag_name)
          echo "version=${v:-latest}" >> "$GITHUB_OUTPUT"
          echo "yt-dlp: ${v:-latest}"

      # Passar a versão como build-arg invalida só a camada do yt-dlp quando sai
      # versão nova; com "latest" fixo o cache do GHA reaproveitaria a antiga.
      # Builda e testa localmente antes de publicar — carrega no daemon (load)
      # em vez de já dar push, pra rodar o smoke test abaixo primeiro.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            YTDLP_VERSION=${{ steps.ytdlp.outputs.version }}
          push: false
          load: true
          tags: mptube-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (container starts and responds)
        run: |
          docker run -d --name mptube-server-ci -p 8080:8080 mptube-server:ci
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8080/ >/dev/null; then
              echo "✓ servidor respondeu"
              exit 0
            fi
            sleep 1
          done
          echo "✗ servidor não respondeu em 20s"
          docker logs mptube-server-ci
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f mptube-server-ci || true

      # Publica a imagem já validada acima no GHCR, só em push na main — assim
      # a VPS (1GB RAM) só precisa dar `docker compose pull`, sem compilar o
      # Rust localmente (ver DEPLOY.md).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker tag mptube-server:ci "$IMAGE:latest"
          docker tag mptube-server:ci "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
