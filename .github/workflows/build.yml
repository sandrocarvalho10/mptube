name: Build mptube

on:
  push:
    tags:
      - "v*"          # Dispara em tags: git tag v1.0.0 && git push --tags
  workflow_dispatch:  # Permite rodar manualmente na aba Actions
    inputs:
      tag:
        description: "Tag da release (ex: v1.0.0)"
        required: true
        default: "v0.1.0"

# Permissão necessária para criar/editar releases no GitHub
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x64 ────────────────────────────────────────────────────
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64

          # ── macOS Apple Silicon ──────────────────────────────────────────
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64

          # ── macOS Intel ──────────────────────────────────────────────────
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64

          # ── Windows x64 ──────────────────────────────────────────────────
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64

    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.label }}

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js ───────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── pnpm ─────────────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # ── Rust ──────────────────────────────────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ── Cache Rust ────────────────────────────────────────────────────────
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Dependências de sistema do Tauri (Linux) ────────────────────────────
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            libdbus-1-dev \
            build-essential \
            curl \
            wget \
            file

      # ── Instalar dependências JS ──────────────────────────────────────────
      - name: Install JS dependencies
        run: pnpm install

      # ── Baixar binários externos (yt-dlp) ─────────────────────────────────
      - name: Download yt-dlp binaries (Linux / macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: bash scripts/download-binaries.sh

      - name: Download yt-dlp binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Invoke-RestMethod "https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest").tag_name
          $url = "https://github.com/yt-dlp/yt-dlp/releases/download/$version/yt-dlp.exe"
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries"
          Invoke-WebRequest -Uri $url -OutFile "src-tauri/binaries/yt-dlp-x86_64-pc-windows-msvc.exe"
          Write-Host "Downloaded yt-dlp $version"

      - name: Download ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Baixa ffmpeg essentials build (contém ffmpeg.exe ~80MB)
          $ffmpegUrl = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $zipPath = "src-tauri/binaries/ffmpeg-win.zip"
          Write-Host "→ Baixando ffmpeg..."
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $zipPath
          Write-Host "→ Extraindo ffmpeg.exe..."
          $extractDir = "src-tauri/binaries/ffmpeg-extracted"
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
          # O zip tem subpasta com nome da versão; localiza ffmpeg.exe dentro de bin/
          $ffmpegExe = Get-ChildItem -Path $extractDir -Recurse -Filter "ffmpeg.exe" |
                       Where-Object { $_.DirectoryName -like "*\bin" } |
                       Select-Object -First 1
          if (-not $ffmpegExe) {
            Write-Error "ffmpeg.exe nao encontrado no zip extraido"
            exit 1
          }
          Copy-Item $ffmpegExe.FullName -Destination "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"
          Remove-Item $zipPath -Force
          Remove-Item $extractDir -Recurse -Force
          Write-Host "✓ ffmpeg pronto em src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"

      # ── Build Tauri ───────────────────────────────────────────────────────
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          releaseName: "mptube ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            ## mptube ${{ github.ref_name }}

            ### Downloads
            - **Windows** → `.msi` ou `.exe` — clique e instale, sem dependências extras
            - **macOS Apple Silicon** → `.dmg` (aarch64)
            - **macOS Intel** → `.dmg` (x86_64)
            - **Linux** → `.deb`, `.rpm` ou `.AppImage` (x86_64)

            > O yt-dlp e o ffmpeg já estão embutidos no instalador.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
